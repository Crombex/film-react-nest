server {
  listen 443 ssl;
  server_name crombex.nomorepartiessite.ru;

  ssl_certificate /etc/letsencrypt/live/crombex.nomorepartiessite.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/crombex.nomorepartiessite.ru/privkey.pem;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }

  location /api/afisha/ {
    proxy_pass http://backend:3000/api/afisha/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /content/afisha/ {
    proxy_pass http://backend:3000/content/afisha/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name crombex.nomorepartiessite.ru;

  location / {
    return 301 https://$host$request_uri;
  }
}