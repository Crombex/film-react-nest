services:
  backend:
    image: ghcr.io/crombex/film-react-nest/backend:latest
    container_name: backend
    networks:
      - internal
      - webnet
    depends_on:
      - postgres
    restart: on-failure
    env_file:
      - .env
  nginx:
    image: ghcr.io/crombex/film-react-nest/nginx-with-frontend:latest
    ports:
      - 80:80
      - 443:443
    networks:
      - webnet
    restart: on-failure
    depends_on:
      - backend
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
  postgres:
    image: postgres:15
    container_name: postgres
    restart: on-failure
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
  
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
    - ./certbot/conf:/etc/letsencrypt
    - ./certbot/www:/var/www/certbot

volumes:
  postgres_data:

networks:
  webnet:
  internal: