name: Deploy checks

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: format code
        run: npm run format:check
      - name: Build backend
        run: npm run build

  frontend-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Build frontend
        run: npm run build

  build-and-deploy:
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/backend:${{ github.sha }}
            ghcr.io/${{ github.actor }}/backend:latest

      - name: Build nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_CDN_URL=${{ secrets.VITE_CDN_URL }}
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/nginx-with-frontend:${{ github.sha }}
            ghcr.io/${{ github.actor }}/nginx-with-frontend:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            cd /home/${{ secrets.VPS_USER }}/app

            docker compose pull

            docker compose up -d --remove-orphans

            docker image prune -f

            docker system df
